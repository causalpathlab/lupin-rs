[package]
name = "legume-gene-text"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Text side of the feature graph: Hugging Face encoder over gene, term and pathway descriptions, vocabulary, and gene–word edges for senna fne"
repository = "https://github.com/causalpathlab/lupin-rs"
homepage = "https://github.com/causalpathlab/lupin-rs"
readme = "README.md"
keywords = ["genomics", "nlp", "embeddings", "gene-text"]
categories = ["science"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
]

[lib]
name = "gene_text"
path = "src/lib.rs"

# CLI lives on `lupin` (`lupin text-qc`, `lupin word-graph`).

[features]
default = []
hdf5 = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "legume-numeric/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "legume-numeric/metal"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
nalgebra = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
candle-core = { version = "0.10" }
candle-nn = { version = "0.10" }
candle-transformers = { version = "0.10" }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
hf-hub = "0.4"
stop-words = "0.10"
rust-stemmers = "1.2"
unicode-segmentation = "1.13"
legume-numeric = { workspace = true, features = ["matrix"] }
data-beans = { workspace = true, features = ["aux"] }

[dev-dependencies]
tempfile = { workspace = true }
