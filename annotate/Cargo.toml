[package]
name = "legume-annotate"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Cell-type annotation (projection, enrichment, ontology)"
repository = "https://github.com/causalpathlab/lupin-rs"
homepage = "https://github.com/causalpathlab/lupin-rs"
readme = "README.md"
keywords = ["genomics", "single-cell", "annotation", "cell-type"]
categories = ["science"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
]

[lib]
name = "annotate"
path = "src/lib.rs"

[features]
default = []
cuda = ["graph-embedding-util/cuda", "legume-numeric/cuda"]
metal = ["graph-embedding-util/metal", "legume-numeric/metal"]

[dependencies]
data-beans = { workspace = true, features = ["aux"] }
enrichment = { workspace = true }
graph-embedding-util = { workspace = true }
legume-numeric = { workspace = true, features = ["matrix", "param", "candle"] }

anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
