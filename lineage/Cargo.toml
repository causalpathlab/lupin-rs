[package]
name = "legume-lineage"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Lineage inference, pseudotime, dyn-assoc, and lineage plots"
repository = "https://github.com/causalpathlab/lupin-rs"
homepage = "https://github.com/causalpathlab/lupin-rs"
keywords = ["genomics", "single-cell", "lineage", "pseudotime"]
categories = ["science"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
]

[lib]
name = "lineage"
path = "src/lib.rs"

[features]
default = []
cuda = [
    "graph-embedding-util/cuda",
    "legume-numeric/cuda",
]
metal = [
    "graph-embedding-util/metal",
    "legume-numeric/metal",
]

[dependencies]
data-beans = { workspace = true, features = ["aux"] }
enrichment = { workspace = true }
graph-embedding-util = { workspace = true }
legume-numeric = { workspace = true, features = ["matrix", "param", "candle", "mcmc"] }
legume-plot = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
statrs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
