[package]
name = "lupin-rs"
version = "0.1.4"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Label, Unfold, Place, Interpret, Narrate — annotation, lineage, pseudotime, association, description, and plots"
repository = "https://github.com/causalpathlab/lupin-rs"
homepage = "https://github.com/causalpathlab/lupin-rs"
readme = "README.md"
keywords = ["genomics", "single-cell", "annotation", "lineage"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
    "lupin-README.md.bak",
]

[[bin]]
name = "lupin"
path = "src/main.rs"

[features]
default = []
hdf5 = ["data-beans/hdf5"]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "legume-numeric/cuda",
    "graph-embedding-util/cuda",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "legume-numeric/metal",
    "graph-embedding-util/metal",
]

[dependencies]
# Foundations
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5.20", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rayon = "1.10.0"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-skia = "0.12"
nalgebra = "0.34"
rand = "0.10.1"
rand_distr = "0.6"
statrs = { version = "0.18", default-features = false }

# Published legume stack
data-beans = { version = "0.6.12", features = ["aux", "alg"] }
enrichment = { version = "0.3.9", package = "legume-enrichment" }
genomic-data = { version = "0.4.1", package = "legume-genomic-types" }
graph-embedding-util = { version = "0.8.4", package = "legume-graph-embedding" }
legume-numeric = { version = "0.8.10", features = ["matrix", "param", "candle", "mcmc"] }
legume-plot = { version = "0.3.2" }

# gene-text encoder stack
candle-core = { version = "0.10" }
candle-nn = { version = "0.10" }
candle-transformers = { version = "0.10" }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
hf-hub = "0.4"
stop-words = "0.10"
rust-stemmers = "1.2"
unicode-segmentation = "1.13"

[dev-dependencies]
tempfile = "3.2"
