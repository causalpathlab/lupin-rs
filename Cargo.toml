[workspace]

members = [
    "annotate",
    "lineage",
    "gene-text",
    "lupin",
]

resolver = "3"

[workspace.package]
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
repository = "https://github.com/causalpathlab/lupin-rs"
homepage = "https://github.com/causalpathlab/lupin-rs"
edition = "2021"
rust-version = "1.91"

[workspace.dependencies]

# Core / CLI
anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"

# Parallelism
num_cpus = "1.16.0"
rayon = "1.10.0"

# Randomness
rand = "0.10.1"
rand_distr = "0.6"
tempfile = "3.2"

# Numeric / linear algebra
nalgebra = "0.34"
nalgebra-sparse = "0.11"
ndarray = { version = "0.17", features = ["rayon", "serde", "approx", "blas"] }
special = "0.13"
statrs = { version = "0.18", default-features = false }

# Data structures / hashing
dashmap = { version = "6.1.0", features = ["rayon"] }
rustc-hash = "2.1"

# Serialization / IO
parquet = "59"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Progress / display
colored = "3"
indicatif = { version = "^0.18", features = ["rayon"] }

# 2D graphics / SVG (senna plot)
base64 = "0.22"
resvg = "0.47"
svg2pdf = "0.13"
tiny-skia = "0.12"
usvg = "0.47"

# Portable explicit SIMD
wide = "0.7"

# Published foundation / product crates
cnv = { version = "0.2.1", package = "mung-cnv" }
data-beans = { version = "0.6.12" }
enrichment = { version = "0.3.9", package = "legume-enrichment" }
genomic-data = { version = "0.4.1", package = "legume-genomic-types" }
graph-embedding-util = { version = "0.8.4", package = "legume-graph-embedding" }
hsblock = { version = "0.1.1", package = "hsblock-rs" }
legume-numeric = { version = "0.8.10" }
legume-plot = { version = "0.3.2" }
senna = { version = "0.18.0", package = "senna-rs" }
