[package]
name = "lupin-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Label, Unfold, Place, Interpret, Narrate — text graphs, cell-type annotation, review, plotting and description"
repository = "https://github.com/causalpathlab/lupin-rs"
homepage = "https://github.com/causalpathlab/lupin-rs"
readme = "README.md"
keywords = ["genomics", "single-cell", "annotation", "cell-type"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
    "lupin-README.md.bak",
    "dev/**",
]

[[bin]]
name = "lupin"
path = "src/main.rs"

[features]
default = []
hdf5 = ["data-beans/hdf5"]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "legume-numeric/cuda",
    "graph-embedding-util/cuda",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "legume-numeric/metal",
    "graph-embedding-util/metal",
]

[dependencies]
# Foundations
anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rayon = "1.10.0"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
nalgebra = "0.34"
nalgebra-sparse = "0.11"

# Published legume stack
data-beans = { version = "0.7.5", features = ["aux", "alg"] }
enrichment = { version = "0.4.1", package = "legume-enrichment" }
graph-embedding-util = { version = "0.8.4", package = "legume-graph-embedding" }
legume-numeric = { version = "0.8.20", features = ["matrix", "candle"] }
legume-plot = { version = "0.3.2" }
# Rasterises figures in memory for the TUI; the version legume-plot uses.
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }

# gene-text encoder stack
candle-core = { version = "0.10" }
candle-nn = { version = "0.10" }
candle-transformers = { version = "0.10" }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
hf-hub = "0.4"
# Fetching the Cell Ontology (both already in the tree via hf-hub).
ureq = "2.12"
dirs = "6"
stop-words = "0.10"
rust-stemmers = "1.2"
unicode-segmentation = "1.13"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
